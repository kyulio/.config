# Premium Monochrome Grayscale Theme for Kitty
# 흑백 장미 배경화면 테마에 맞춘 차분하고 고급스러운 그레이스케일 스킴입니다.

foreground #ffffff
background #000000

# Black
color0 #1c1c1c
color8 #4e4e4e

# Red -> Slate Gray
color1 #8a8a8a
color9 #bcbcbc

# Green -> Light Gray
color2  #a8a8a8
color10 #d0d0d0

# Yellow -> Medium Gray
color3  #b0b0b0
color11 #e4e4e4

# Blue -> Soft Silver
color4  #c6c6c6
color12 #eeeeee

# Magenta -> Muted Gray
color5  #949494
color13 #b2b2b2

# Cyan -> Steel Gray
color6  #808080
color14 #aaaaaa

# White
color7  #e4e4e4
color15 #ffffff

# Cursor
cursor #ffffff
cursor_text_color #000000

# Selection highlight
selection_foreground none
selection_background #333333

# The color for highlighting URLs on mouse-over
url_color #cccccc

# Window borders
active_border_color #ffffff
inactive_border_color #111111
bell_border_color #888888

# Tab bar
tab_bar_style fade
tab_fade 1
active_tab_foreground   #ffffff
active_tab_background   #000000
active_tab_font_style   bold
inactive_tab_foreground #888888
inactive_tab_background #111111

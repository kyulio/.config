# hyprlock — waybar 패널과 같은 모노크롬 카드 디자인
# (카드: rgba(8,8,8,.82) + 1px 흰 테두리 16% + 둥글기 10 / 입력창: 패널 entry 와 동일)

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /home/kyulio/Pictures/gian-d-YE6iUShVcps-unsplash.jpg
    color = rgb(0, 0, 0)
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ── 시계 / 날짜 ──
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Propo Light
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B" | tr '[:lower:]' '[:upper:]'
    color = rgba(136, 136, 136, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 140
    halign = center
    valign = center
}

# ── 카드 ──
shape {
    monitor =
    size = 360, 200
    color = rgba(8, 8, 8, 0.82)
    rounding = 10
    border_size = 1
    border_color = rgba(255, 255, 255, 0.16)
    position = 0, -55
    halign = center
    valign = center
}

# 머리글: 아이콘 / 제목 / 사용자
label {
    monitor =
    text = 󰌾
    color = rgba(255, 255, 255, 1.0)
    font_size = 24
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 12
    halign = center
    valign = center
}

label {
    monitor =
    text = Locked
    color = rgba(255, 255, 255, 1.0)
    font_size = 14
    font_family = Noto Sans CJK KR Bold
    position = 0, -26
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "$USER" | tr '[:lower:]' '[:upper:]'
    color = rgba(136, 136, 136, 1.0)
    font_size = 9
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, -48
    halign = center
    valign = center
}

# 구분선
shape {
    monitor =
    size = 320, 1
    color = rgba(255, 255, 255, 0.10)
    rounding = 0
    border_size = 0
    position = 0, -68
    halign = center
    valign = center
}

# 비밀번호 입력 (패널 entry 와 동일)
input-field {
    monitor =
    size = 320, 40
    outline_thickness = 1
    rounding = 7
    outer_color = rgba(255, 255, 255, 0.14)
    inner_color = rgba(255, 255, 255, 0.06)
    font_color = rgb(255, 255, 255)
    font_family = JetBrainsMono Nerd Font Propo
    check_color = rgba(255, 255, 255, 0.45)
    fail_color = rgba(255, 255, 255, 0.70)
    fail_text = 비밀번호가 맞지 않아요
    placeholder_text = <span foreground="##777777">Password</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
}

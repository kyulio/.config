# hyprlock.conf (Monochrome Grayscale Lockscreen)
# 배경화면과 동일한 흑백 장미 이미지를 블러 처리하여 고급스러운 분위기를 연출하는 화면 잠금 설정입니다.

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /home/kyulio/Pictures/gian-d-YE6iUShVcps-unsplash.jpg
    color = rgb(0, 0, 0)
    
    # 우아한 블러 효과
    blur_passes = 3
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 시간 (Time)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# 날짜 (Date)
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(200, 200, 200, 0.7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# 비밀번호 입력창 (Password Input)
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 10
    check_color = rgba(255, 255, 255, 0.6)
    fail_color = rgb(204, 34, 34)
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

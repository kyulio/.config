<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 기본 글꼴: 본문 Pretendard (한글 포함), 고정폭 Geist Mono Nerd -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Pretendard</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>GeistMono Nerd Font Mono</family>
      <family>D2Coding</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>
  <!-- 한국어 페이지에서 Noto CJK 대신 Pretendard -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Pretendard</string></edit>
  </match>
</fontconfig>

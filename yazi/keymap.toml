#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on   = [ "c", "d" ]
run  = "shell -- ripdrag -x %s"
desc = "Drag and drop selected"

# l / Enter: 폴더면 들어가고, 파일이면 열기
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

# 미리보기 창
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview"

[[mgr.prepend_keymap]]
on   = [ "t", "p" ]
run  = "plugin toggle-pane min-preview"
desc = "Show or hide preview"

# 권한 / 디스크
[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod selected files"

[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Mount / unmount drives"

# 자주 가는 곳 (기본: gh 홈, gc ~/.config, gd 다운로드)
[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Pictures"
desc = "Go to ~/Pictures"

[[mgr.prepend_keymap]]
on   = [ "g", "v" ]
run  = "cd ~/Videos"
desc = "Go to ~/Videos"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents"
desc = "Go to ~/Documents"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/.config/hypr/scripts"
desc = "Go to hypr scripts"

# 현재 폴더에서 터미널 열기
[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "kitty --detach --directory \"$PWD\"" --orphan'
desc = "Open terminal here"

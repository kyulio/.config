#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
title_format   = "Yazi: {cwd}"

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 1600
max_height    = 1800
image_filter  = "lanczos3"
image_quality = 85

[opener]
# ripdrag 으로 다른 앱에 드래그 (O 메뉴에서 선택)
drag = [ { run = 'ripdrag -x "$@"', orphan = true, desc = "Drag & drop", for = "unix" } ]

[open]
append_rules = [
	{ url = "*", use = "drag" },
]

# git 상태 표시 (git 플러그인)
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
